# Local copy of the production setup: Postgres + web + worker.
#   docker compose up --build    then open http://localhost:3000
# For day-to-day coding, `docker compose up db` and `npm run dev` is quicker.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: handover
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 20
  web:
    build: .
    environment: &env
      DATABASE_URL: postgres://postgres:dev@db:5432/handover
      APP_URL: http://localhost:3000
      PORT: "3000"
      DATA_DIR: /data
      JOB_MODE: worker
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["3000:3000"]
    volumes: [uploads:/data]
    depends_on: { db: { condition: service_healthy } }
  worker:
    build: .
    command: ["node", "worker.js"]
    environment: *env
    volumes: [uploads:/data]
    depends_on: { db: { condition: service_healthy } }
volumes:
  pgdata:
  uploads:
